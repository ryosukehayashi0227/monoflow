<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoFlow - Professional Kanban</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M30 30 L 30 70 L 50 50 L 70 70 L 70 30' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
</head>
<body class="bg-[#f8fafc] text-[#1e293b] antialiased">

    <div class="max-w-[1600px] mx-auto px-6 md:px-12 py-16">
        <!-- Header Section -->
        <header class="flex flex-col gap-8 mb-12">
            <div class="flex items-center gap-6 pb-8 border-b border-slate-200/60 relative">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-blue-500/30 shrink-0 transform transition-all hover:rotate-3 hover:scale-110 duration-500 group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-white transform group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="6" y2="18"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="18" y1="6" x2="18" y2="10"></line></svg>
                </div>
                <div>
                    <h1 class="text-5xl font-black tracking-tighter text-slate-900 leading-tight">MonoFlow</h1>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] mt-1 ml-1 opacity-80">Simple Personal Kanban</p>
                </div>
                <!-- Subtle background accent -->
                <div class="absolute top-[-50%] right-[-10%] w-96 h-96 bg-blue-400/5 blur-[100px] pointer-events-none rounded-full"></div>
            </div>

            <!-- Toolbar -->
            <div class="flex flex-col md:flex-row justify-between gap-4 w-full items-start md:items-center">
                <div class="relative w-full md:w-auto">
                    <select id="label-filter" class="appearance-none bg-white/80 backdrop-blur-sm border border-slate-200 rounded-2xl px-5 py-3 pr-12 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-600 font-bold text-sm cursor-pointer hover:bg-white hover:border-slate-300 w-full md:w-56">
                        <option value="all">すべてのラベル</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <i data-lucide="filter" class="w-4 h-4"></i>
                    </div>
                </div>
                <div class="flex gap-3 w-full md:w-auto ml-auto">
                    <form id="add-task-form" class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="new-task-input" placeholder="新しいタスクを入力..." class="bg-white/80 backdrop-blur-sm border border-slate-200 rounded-2xl px-5 py-3 w-full md:w-[500px] shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm font-medium">
                        <button type="submit" class="bg-blue-600 text-white font-bold rounded-2xl px-6 py-3 hover:bg-blue-700 shadow-lg shadow-blue-500/30 active:scale-95 transition-all flex items-center gap-2 shrink-0">
                            <i data-lucide="plus" class="w-5 h-5"></i> <span class="hidden md:inline">追加</span>
                        </button>
                    </form>
                    <div class="relative ml-1">
                        <button onclick="toggleMenu(event)" class="bg-white/80 backdrop-blur-sm border border-slate-200 rounded-2xl px-4 py-3 text-slate-600 hover:bg-white hover:border-slate-300 shadow-sm transition-all flex items-center justify-center active:scale-90">
                            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                        </button>
                        <div id="settings-menu" class="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 hidden z-20 overflow-hidden">
                                                    <button onclick="DataService.export()" class="w-full text-left px-4 py-3 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-2 transition-colors">
                                                        <i data-lucide="download" class="w-4 h-4 text-slate-400"></i> エクスポート (JSON)
                                                    </button>
                                                                            <button onclick="document.getElementById('import-file').click()" class="w-full text-left px-4 py-3 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-2 border-t border-slate-100 transition-colors">
                                                                                <i data-lucide="upload" class="w-4 h-4 text-slate-400"></i> インポート
                                                                            </button>
                        <a href="metrics.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-2 border-t border-slate-100 transition-colors">
                            <i data-lucide="bar-chart-2" class="w-4 h-4 text-slate-400"></i> Metrics
                        </a>
                        <a href="burndown.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-2 border-t border-slate-100 transition-colors">
                            <i data-lucide="trending-down" class="w-4 h-4 text-slate-400"></i> Burndown
                        </a>
                                                <a href="help.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-2 border-t border-slate-100 transition-colors">
                                                    <i data-lucide="help-circle" class="w-4 h-4 text-slate-400"></i> User Guide
                                                </a>
                                                <button onclick="DataService.resetAll()" class="w-full text-left px-4 py-3 hover:bg-red-50 text-sm font-bold text-red-600 flex items-center gap-2 border-t border-red-100 transition-colors">
                                                    <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i> ボードのリセット
                                                </button>
                                                <input type="file" id="import-file" class="hidden" accept=".json" onchange="DataService.import(this)">                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Kanban Board -->
        <main id="board" class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start"></main>
    </div>

    <!-- Task Detail Modal -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 modal">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl transform transition-all scale-95 opacity-0 modal-content m-4 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">タスク詳細</h3>
                <button onclick="Modal.close()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 overflow-y-auto">
                <div id="modal-meta-info" class="mb-6 flex justify-between text-[10px] font-bold uppercase tracking-widest text-slate-400 border-b border-slate-50 pb-4">
                    <span id="display-created-at">作成: ---</span>
                    <span id="display-updated-at">更新: ---</span>
                </div>
                <form id="edit-task-form" class="space-y-6">
                    <input type="hidden" id="edit-task-id">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">タイトル</label>
                        <input type="text" id="edit-task-content" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">優先度</label>
                        <div class="flex gap-2" id="priority-options-container">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <label class="block text-sm font-semibold text-slate-700 mb-3">ラベル</label>
                        <div class="space-y-3 mb-5">
                            <input type="text" id="new-label-name" placeholder="新しいラベル名" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 shadow-sm">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex gap-3 items-center bg-white border border-slate-200 rounded-lg px-3 py-2 shadow-sm" id="label-color-picker">
                                    <!-- Injected by JS -->
                                </div>
                                <button type="button" onclick="LabelManager.create()" class="bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-slate-900 shadow-sm shrink-0">追加</button>
                            </div>
                        </div>
                        <div id="edit-task-labels" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">親タスク</label>
                        <div class="relative">
                            <select id="edit-task-parent" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none bg-white text-slate-700">
                                <option value="">(なし)</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500"><i data-lucide="chevron-down" class="w-4 h-4"></i></div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">詳細メモ</label>
                        <textarea id="edit-task-desc" rows="3" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-600 resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">期限</label>
                        <input type="date" id="edit-task-date" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-600">
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="Modal.close()" class="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-200 rounded-xl transition-colors">キャンセル</button>
                <button onclick="Modal.save()" class="bg-blue-600 text-white font-semibold rounded-xl px-6 py-2.5 hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all">保存</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="js/app.js"></script>
</body>
</html>
