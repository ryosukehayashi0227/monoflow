<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoFlow - Professional Kanban</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M30 30 L 30 70 L 50 50 L 70 70 L 70 30' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
</head>
<body class="bg-[#f8fafc] text-[#1e293b] antialiased">
    <div class="max-w-[1600px] mx-auto px-4 md:px-8 py-4">
        <!-- Dependency Canvas Overlay -->
        <svg id="connector-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-[100]"></svg>

        <!-- Header Section -->
        <header class="flex flex-col gap-4 mb-6">
            <div class="flex items-center gap-4 pb-4 border-b border-slate-200/60 relative">
                <a href="index.html" class="flex items-center gap-4 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 rounded-xl flex items-center justify-center shadow-lg shrink-0 transform transition-all group-hover:rotate-3 group-hover:scale-110 duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white transform group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="6" y2="18"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="18" y1="6" x2="18" y2="10"></line></svg>
                    </div>
                    <div>
                        <h1 id="brand-title" class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight">MonoFlow</h1>
                        <p id="brand-subtitle" class="text-slate-400 font-bold uppercase tracking-widest text-[8px] mt-0 opacity-80">Simple Personal Kanban</p>
                    </div>
                </a>

                <!-- Tabs Navigation -->
                <nav class="flex items-center gap-3 ml-8 hidden md:flex">
                    <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                        <a href="index.html" id="nav-board" class="tab-item active px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Board</a>
                        <a href="metrics.html" id="nav-metrics" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Metrics</a>
                        <a href="burndown.html" id="nav-burndown" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Burndown</a>
                    </div>
                    <a href="about.html" id="about-link" class="px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all border border-blue-100 dark:border-blue-800/50 shadow-sm">What is MonoFlow?</a>
                </nav>

                <!-- Global Toolbar -->
                <div class="flex items-center gap-2 ml-auto">
                    <!-- Notifications -->
                    <div class="relative">
                        <button onclick="NotificationService.toggleNotifications(event)" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center relative">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                            <span id="notify-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center hidden border-2 border-white dark:border-slate-900">0</span>
                        </button>
                        <div id="notify-menu" class="absolute right-0 top-full mt-2 w-72 bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-2xl border border-slate-100 dark:border-slate-800 hidden z-50 overflow-hidden text-left">
                            <div class="p-4 border-b border-slate-50 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/50">
                                <h3 id="notify-title" class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><i data-lucide="bell" class="w-3 h-3"></i> Notification Center</h3>
                            </div>
                            <div id="notify-list" class="max-h-80 overflow-y-auto">
                                <!-- Notifications injected here -->
                            </div>
                        </div>
                    </div>

                    <a href="help.html" id="help-btn" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="User Guide"><i data-lucide="help-circle" class="w-4 h-4"></i></a>
                    <button id="lang-btn" onclick="Common.setLanguage(State.language === 'ja' ? 'en' : 'ja')" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="Switch Language"><i data-lucide="languages" class="w-4 h-4"></i></button>
                    <button id="theme-btn" onclick="Common.toggleTheme()" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center"><i data-lucide="sun" id="theme-icon-light" class="w-4 h-4 hidden"></i><i data-lucide="moon" id="theme-icon-dark" class="w-4 h-4"></i></button>
                </div>
            </div>

            <!-- Toolbar (Search & Add) -->
            <div class="flex flex-col md:flex-row justify-between gap-3 w-full items-start md:items-center">
                <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                    <div class="relative w-full md:w-auto">
                        <input type="text" id="search-input" placeholder="Search..." class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 pl-10 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm font-medium dark:text-white w-full md:w-48">
                        <div class="absolute inset-y-0 left-0 flex items-center px-3 pointer-events-none text-slate-400"><i data-lucide="search" class="w-3.5 h-3.5"></i></div>
                    </div>
                    <div class="relative w-full md:w-auto">
                        <select id="label-filter" class="appearance-none bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 pr-10 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-600 dark:text-slate-300 font-bold text-xs cursor-pointer hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 w-full md:w-40"><option value="all">すべてのラベル</option></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400"><i data-lucide="filter" class="w-3.5 h-3.5"></i></div>
                    </div>
                    <div class="relative w-full md:w-auto">
                        <select id="priority-filter" class="appearance-none bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 pr-10 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-slate-600 dark:text-slate-300 font-bold text-xs cursor-pointer hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 w-full md:w-40"></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i></div>
                    </div>
                </div>
                <div class="flex gap-2 w-full md:w-auto ml-auto">
                    <form id="add-task-form" class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="new-task-input" placeholder="新しいタスクを入力..." class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 w-full md:w-[400px] shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm font-medium dark:text-white">
                        <button type="submit" class="bg-blue-600 text-white font-bold rounded-xl px-4 py-2 hover:bg-blue-700 shadow-lg shadow-blue-500/30 active:scale-95 transition-all flex items-center gap-2 shrink-0 text-sm"><i data-lucide="plus" class="w-4 h-4"></i> <span id="add-btn-text" class="hidden md:inline">追加</span></button>
                    </form>
                    <div class="relative ml-1">
                        <button onclick="Common.toggleMenu(event)" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 shadow-sm transition-all flex items-center justify-center active:scale-90"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                        <div id="settings-menu" class="absolute right-0 top-full mt-2 w-48 bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-100 dark:border-slate-800 hidden z-20 overflow-hidden text-left">
                            <a href="index.html" class="md:hidden w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="layout" class="w-4 h-4 text-slate-400"></i> <span id="menu-board-text">Board</span></a>
                            <a href="metrics.html" class="md:hidden w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="bar-chart-2" class="w-4 h-4 text-slate-400"></i> <span id="menu-metrics-text">Metrics</span></a>
                            <a href="burndown.html" class="md:hidden w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="trending-down" class="w-4 h-4 text-slate-400"></i> <span id="menu-burndown-text">Burndown</span></a>
                            <a href="about.html" class="md:hidden w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-blue-600 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="info" class="w-4 h-4 text-blue-400"></i> <span id="menu-about-text">About</span></a>
                            <button id="menu-export" onclick="DataService.export()" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors"><i data-lucide="download" class="w-4 h-4 text-slate-400"></i> Export</button>
                            <button id="menu-import" onclick="document.getElementById('import-file').click()" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium text-slate-700 dark:text-slate-300 flex items-center gap-2 border-t border-slate-100 dark:border-slate-800 transition-colors"><i data-lucide="upload" class="w-4 h-4 text-slate-400"></i> Import</button>
                            <button id="menu-archive" onclick="Archive.open()" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium text-slate-700 dark:text-slate-300 flex items-center gap-2 border-t border-slate-100 dark:border-slate-800 transition-colors"><i data-lucide="archive" class="w-4 h-4 text-slate-400"></i> Archive</button>
                            <button id="menu-reset" onclick="DataService.resetAll()" class="w-full text-left px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-bold text-red-600 flex items-center gap-2 border-t border-red-100 dark:border-red-900/20 transition-colors"><i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i> Reset</button>
                            <input type="file" id="import-file" class="hidden" accept=".json" onchange="DataService.import(this)">
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main id="board" class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start"></main>
        <footer class="mt-32 pt-16 border-t border-slate-200 dark:border-slate-800 text-center">
            <p id="footer-text" class="text-slate-400 text-[10px] font-black uppercase tracking-[0.4em] mb-2">MonoFlow Productivity System</p>
            <p class="text-slate-300 dark:text-slate-600 text-[10px] font-medium tracking-widest uppercase">Built for High-Performance Personal Kanban &copy; 2026</p>
        </footer>
    </div>
    
    <!-- Archive Modal -->
    <div id="archive-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 modal">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[2.5rem] shadow-2xl transform transition-all scale-95 opacity-0 modal-content m-4 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center p-8 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2"><i data-lucide="archive" class="w-6 h-6 text-slate-400"></i> Archived Tasks</h3>
                <button onclick="Archive.close()" class="text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div id="archive-list" class="p-8 overflow-y-auto space-y-4 flex-grow"></div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 modal">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl transform transition-all scale-95 opacity-0 modal-content m-4 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-lg font-bold text-slate-800 dark:text-white">Task Details</h3>
                <button onclick="Modal.close()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto">
                <div id="modal-meta-info" class="mb-6 flex justify-between text-[10px] font-bold uppercase tracking-widest text-slate-400 border-b border-slate-50 dark:border-slate-800 pb-4">
                    <span id="display-created-at">Created: ---</span>
                    <span id="display-updated-at">Updated: ---</span>
                </div>
                
                <form id="edit-task-form" class="space-y-6">
                    <input type="hidden" id="edit-task-id">
                    
                    <!-- Title -->
                    <div>
                        <label id="modal-label-title" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">タイトル</label>
                        <input type="text" id="edit-task-content" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
                    </div>

                    <!-- Priority -->
                    <div>
                        <label id="modal-label-priority" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">優先度</label>
                        <div class="flex gap-2" id="priority-options-container"></div>
                    </div>

                    <!-- Labels -->
                    <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                        <label id="modal-label-tags" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3">ラベル</label>
                        <div class="space-y-3 mb-5">
                            <input type="text" id="new-label-name" placeholder="新しいラベル名" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 shadow-sm">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex gap-3 items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 shadow-sm" id="label-color-picker"></div>
                                <button id="modal-add-tag-btn" type="button" onclick="LabelManager.create()" class="bg-slate-800 dark:bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-slate-900 dark:hover:bg-blue-700 shadow-sm shrink-0">追加</button>
                            </div>
                        </div>
                        <div id="edit-task-labels" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Parent Task -->
                    <div>
                        <label id="modal-label-parent" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">親タスク</label>
                        <div class="relative">
                            <select id="edit-task-parent" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none bg-white">
                                <option value="">(なし)</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500"><i data-lucide="chevron-down" class="w-4 h-4"></i></div>
                        </div>
                    </div>

                    <!-- Blockers -->
                    <div>
                        <label id="modal-label-blocker" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">ブロッカー (依存タスク)</label>
                        <div class="space-y-3">
                            <div class="flex gap-2">
                                <div class="relative flex-grow">
                                    <select id="edit-task-blocker-select" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none bg-white"></select>
                                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500"><i data-lucide="chevron-down" class="w-4 h-4"></i></div>
                                </div>
                                <button type="button" id="modal-add-blocker-btn" class="bg-slate-800 dark:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-900 dark:hover:bg-blue-700 shadow-sm shrink-0">追加</button>
                            </div>
                            <div id="edit-task-blockers-list" class="flex flex-col gap-2"></div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label id="modal-label-desc" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">詳細メモ</label>
                        <textarea id="edit-task-desc" rows="3" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-600 dark:text-slate-300 resize-none"></textarea>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label id="modal-label-date" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">期限</label>
                        <input type="date" id="edit-task-date" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3 rounded-b-2xl">
                <button id="modal-cancel-btn" onclick="Modal.close()" class="px-5 py-2.5 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors">Cancel</button>
                <button id="modal-save-btn" onclick="Modal.save()" class="bg-blue-600 text-white font-semibold rounded-xl px-6 py-2.5 hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all">Save</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
