<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoFlow - Burndown Chart</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M30 30 L 30 70 L 50 50 L 70 70 L 70 30' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased bg-[#f8fafc] dark:bg-[#0f172a]">
    <div class="max-w-[1600px] mx-auto px-4 md:px-8 py-4">
        <!-- Header Section (Unified) -->
        <header class="flex flex-col gap-4 mb-6">
            <div class="flex items-center gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 relative">
                <a href="index.html" class="flex items-center gap-4 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 rounded-xl flex items-center justify-center shadow-lg shrink-0 transform transition-all group-hover:rotate-3 group-hover:scale-110 duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white transform group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="6" y2="18"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="18" y1="6" x2="18" y2="10"></line></svg>
                    </div>
                    <div>
                        <h1 id="brand-title" class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight">MonoFlow</h1>
                        <p id="brand-subtitle" class="text-slate-400 font-bold uppercase tracking-widest text-[8px] mt-0 opacity-80">Simple Personal Kanban</p>
                    </div>
                </a>
                <nav class="flex items-center gap-3 ml-8 hidden md:flex">
                    <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                        <a href="index.html" id="nav-board" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Board</a>
                        <a href="metrics.html" id="nav-metrics" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Metrics</a>
                        <a href="burndown.html" id="nav-burndown" class="tab-item active px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Burndown</a>
                    </div>
                    <a href="about.html" id="about-link" class="px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all border border-blue-100 dark:border-blue-800/50 shadow-sm">What is MonoFlow?</a>
                </nav>
                <div class="flex items-center gap-2 ml-auto">
                    <!-- Notifications -->
                    <div class="relative">
                        <button onclick="NotificationService.toggleNotifications(event)" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center relative">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                            <span id="notify-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center hidden border-2 border-white dark:border-slate-900">0</span>
                        </button>
                        <div id="notify-menu" class="absolute right-0 top-full mt-2 w-72 bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-2xl border border-slate-100 dark:border-slate-800 hidden z-50 overflow-hidden text-left">
                            <div class="p-4 border-b border-slate-50 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/50">
                                <h3 id="notify-title" class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><i data-lucide="bell" class="w-3 h-3"></i> Notification Center</h3>
                            </div>
                            <div id="notify-list" class="max-h-80 overflow-y-auto"></div>
                        </div>
                    </div>
                    <a href="help.html" id="help-btn" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="User Guide"><i data-lucide="help-circle" class="w-4 h-4"></i></a>
                    <button id="lang-btn" onclick="Common.setLanguage(State.language === 'ja' ? 'en' : 'ja')" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="Switch Language"><i data-lucide="languages" class="w-4 h-4"></i></button>
                    <button id="theme-btn" onclick="Common.toggleTheme()" class="p-2.5 rounded-2xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center"><i data-lucide="sun" id="theme-icon-light" class="w-4 h-4 hidden"></i><i data-lucide="moon" id="theme-icon-dark" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-white dark:bg-slate-900 p-2 pl-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm w-fit">
                <div class="relative group ml-auto">
                    <button onclick="Common.toggleMenu(event)" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 shadow-sm transition-all flex items-center justify-center active:scale-90 md:hidden mr-2"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                    <div id="settings-menu" class="absolute left-0 top-full mt-2 w-48 bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-100 dark:border-slate-800 hidden z-20 overflow-hidden text-left">
                        <a href="index.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="layout" class="w-4 h-4 text-slate-400"></i> <span id="menu-board-text">Board</span></a>
                        <a href="metrics.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="bar-chart-2" class="w-4 h-4 text-slate-400"></i> <span id="menu-metrics-text">Metrics</span></a>
                        <a href="burndown.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="trending-down" class="w-4 h-4 text-slate-400"></i> <span id="menu-burndown-text">Burndown</span></a>
                        <a href="about.html" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-bold text-blue-600 flex items-center gap-2 transition-colors border-b border-slate-100 dark:border-slate-800"><i data-lucide="info" class="w-4 h-4 text-blue-400"></i> <span id="menu-about-text">About</span></a>
                    </div>
                </div>
                <div id="burndown-period-label" class="text-[10px] font-black text-slate-400 uppercase tracking-wider">表示期間</div>
                <div class="flex items-center gap-2"><input type="date" id="start-date" class="text-sm font-bold text-slate-600 dark:text-slate-300 focus:outline-none bg-transparent"><span class="text-slate-300">→</span><input type="date" id="end-date" class="text-sm font-bold text-slate-600 dark:text-slate-300 focus:outline-none bg-transparent"></div>
                <div id="burndown-deadline-label" class="text-[10px] font-black text-orange-400 uppercase tracking-wider ml-4">目標期日</div>
                <input type="date" id="target-deadline" class="text-sm font-bold text-slate-600 dark:text-slate-300 focus:outline-none bg-transparent">
                <button onclick="initBurndown()" class="bg-slate-900 dark:bg-blue-600 text-white p-2 rounded-xl hover:opacity-90 transition-all ml-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
            </div>
        </header>
        <div class="bg-white dark:bg-slate-900 p-10 rounded-[3rem] border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden"><div class="flex justify-between items-center mb-10"><h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2"><i data-lucide="line-chart" class="w-4 h-4"></i> <span id="burndown-trend-label">残タスク数の推移</span></h2><div id="active-task-count" class="text-xs font-black text-blue-600 bg-blue-50 dark:bg-blue-900/20 px-4 py-1.5 rounded-full">現在: -- タスク</div></div><div class="h-[500px] w-full"><canvas id="burndownChart"></canvas></div></div>
        <footer class="mt-32 pt-16 border-t border-slate-200 dark:border-slate-800 text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.3em]"><p id="footer-text">&copy; 2026 MonoFlow Productivity</p></footer>
    </div>
    <script src="js/common.js"></script>
    <script src="js/burndown.js"></script>
</body>
</html>
