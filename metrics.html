<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoFlow - Metrics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M30 30 L 30 70 L 50 50 L 70 70 L 70 30' fill='none' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .stat-card { @apply bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-center; }
        .stat-value { @apply text-4xl font-black tracking-tighter text-slate-900 dark:text-white mb-1; }
        .stat-label { @apply text-[10px] font-black uppercase tracking-[0.2em] text-slate-400; }
    </style>
</head>
<body class="antialiased bg-[#f8fafc] dark:bg-[#0f172a]">
    <div class="max-w-[1600px] mx-auto px-4 md:px-8 py-4">
        <!-- Header Section (Unified) -->
        <header class="flex flex-col gap-4 mb-6">
            <div class="flex items-center gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 relative">
                <a href="index.html" class="flex items-center gap-4 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 rounded-xl flex items-center justify-center shadow-lg shrink-0 transform transition-all group-hover:rotate-3 group-hover:scale-110 duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white transform group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="6" y2="18"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="18" y1="6" x2="18" y2="10"></line></svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight">MonoFlow</h1>
                        <p class="text-slate-400 font-bold uppercase tracking-widest text-[8px] mt-0 opacity-80">Simple Personal Kanban</p>
                    </div>
                </a>
                <nav class="flex items-center gap-3 ml-8 hidden md:flex">
                    <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                        <a href="index.html" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Board</a>
                        <a href="metrics.html" class="tab-item active px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Metrics</a>
                        <a href="burndown.html" class="tab-item px-4 py-1.5 rounded-lg text-xs font-bold transition-all">Burndown</a>
                    </div>
                    <a href="about.html" id="about-link" class="px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all border border-blue-100 dark:border-blue-800/50 shadow-sm">What is MonoFlow?</a>
                </nav>
                <div class="flex items-center gap-2 ml-auto">
                    <a href="help.html" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="User Guide"><i data-lucide="help-circle" class="w-4 h-4"></i></a>
                    <button onclick="Common.setLanguage(State.language === 'ja' ? 'en' : 'ja')" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center" title="Switch Language"><i data-lucide="languages" class="w-4 h-4"></i></button>
                    <button onclick="Common.toggleTheme()" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-90 shadow-sm flex items-center justify-center"><i data-lucide="sun" id="theme-icon-light" class="w-4 h-4 hidden"></i><i data-lucide="moon" id="theme-icon-dark" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex flex-col lg:flex-row items-stretch lg:items-center gap-4">
                <div class="flex items-center gap-3 bg-white dark:bg-slate-900 p-2 pl-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex-grow">
                    <div id="metrics-period-label" class="text-[10px] font-black text-slate-400 uppercase tracking-wider">期間</div>
                    <div class="flex items-center gap-2">
                        <input type="date" id="start-date" class="text-sm font-bold text-slate-600 dark:text-slate-300 focus:outline-none bg-transparent">
                        <span class="text-slate-300">→</span>
                        <input type="date" id="end-date" class="text-sm font-bold text-slate-600 dark:text-slate-300 focus:outline-none bg-transparent">
                    </div>
                </div>
                <div class="relative group">
                    <button onclick="toggleLabelMenu(event)" class="flex items-center gap-3 bg-white dark:bg-slate-900 p-2 pl-5 pr-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm hover:border-blue-300 transition-all min-w-[180px]">
                        <div id="metrics-label-label" class="text-[10px] font-black text-slate-400 uppercase tracking-wider shrink-0">ラベル</div>
                        <div id="selected-label-count" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg ml-auto">すべて</div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </button>
                    <div id="metrics-label-menu" class="absolute left-0 top-full mt-2 w-64 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-[1.5rem] shadow-2xl border border-slate-100 dark:border-slate-800 hidden z-30 p-4 max-h-80 overflow-y-auto">
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-50 dark:border-slate-800"><span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">ラベルを選択</span><button onclick="clearLabels()" class="text-[10px] font-bold text-blue-500 hover:text-blue-700">クリア</button></div>
                        <div id="metrics-label-chips" class="flex flex-col gap-1"></div>
                    </div>
                </div>
                <button onclick="initMetrics()" class="bg-slate-900 dark:bg-blue-600 text-white p-3 rounded-2xl hover:opacity-90 transition-all active:scale-90 shadow-lg"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
            </div>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="stat-card"><div id="total-tasks" class="stat-value">0</div><div class="stat-label">全タスク数</div></div>
            <div class="stat-card"><div id="completion-rate" class="stat-value">0%</div><div class="stat-label">完了率</div></div>
            <div class="stat-card"><div id="avg-days" class="stat-value">0.0</div><div class="stat-label">平均完了日数</div></div>
            <div class="stat-card border-green-200 bg-green-50/30 dark:bg-green-900/10"><div id="done-tasks" class="stat-value text-green-600">0</div><div class="stat-label text-green-500/70">合計完了数</div></div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-sm"><h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8 flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4"></i> ステータス分布</h2><div class="h-64 relative flex items-center justify-center"><canvas id="statusChart"></canvas></div></div>
            <div class="bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-sm"><h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> 優先度別の分布</h2><div class="h-64 relative flex items-center justify-center"><canvas id="priorityChart"></canvas></div></div>
        </div>
        <footer class="mt-32 pt-16 border-t border-slate-200 dark:border-slate-800 text-center"><p class="text-slate-400 text-xs font-black uppercase tracking-[0.3em]">&copy; 2026 MonoFlow Metrics</p></footer>
    </div>
    <script src="js/common.js"></script>
    <script src="js/metrics.js"></script>
</body>
</html>
