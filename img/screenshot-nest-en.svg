<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#F8FAFC"/>
  <!-- Nested Cards Layout -->
  <rect x="250" y="60" width="300" height="60" rx="15" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="270" y="95" fill="#1E293B" font-family="sans-serif" font-size="14" font-weight="bold">Parent Task (Project A)</text>
  <!-- Connection Line -->
  <path d="M280 120 V 180 H 310" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="310" y="150" width="240" height="60" rx="15" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="330" y="185" fill="#1E293B" font-family="sans-serif" font-size="12">Subtask 1</text>
  <path d="M280 180 V 260 H 310" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="310" y="230" width="240" height="60" rx="15" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="330" y="265" fill="#1E293B" font-family="sans-serif" font-size="12">Subtask 2</text>
  <!-- Virtual Parent Label -->
  <rect x="580" y="60" width="180" height="40" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <text x="595" y="85" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">VIRTUAL PARENT</text>
</svg>