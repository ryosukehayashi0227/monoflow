<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#F8FAFC"/>
  <!-- Header Mock -->
  <rect x="0" y="0" width="800" height="80" fill="white"/>
  <rect x="40" y="20" width="40" height="40" rx="10" fill="#2563EB"/>
  <rect x="100" y="25" width="120" height="15" rx="4" fill="#1E293B"/>
  <rect x="100" y="45" width="80" height="8" rx="2" fill="#94A3B8"/>
  <!-- Add Form Mock -->
  <rect x="450" y="20" width="200" height="40" rx="12" fill="white" stroke="#E2E8F0"/>
  <text x="465" y="45" fill="#CBD5E1" font-family="sans-serif" font-size="12">新しいタスクを入力...</text>
  <rect x="660" y="20" width="100" height="40" rx="12" fill="#2563EB"/>
  <text x="690" y="45" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">追加</text>
  <!-- Board Mock -->
  <rect x="40" y="100" width="220" height="280" rx="20" fill="#E2E8F0" opacity="0.4"/>
  <rect x="55" y="140" width="190" height="60" rx="12" fill="white" shadow="0 2 4 rgba(0,0,0,0.05)"/>
  <rect x="70" y="155" width="120" height="10" rx="2" fill="#1E293B"/>
  <rect x="70" y="175" width="40" height="15" rx="8" fill="#FEE2E2" stroke="#FECACA"/>
  <!-- Cursor and New Item -->
  <path d="M710 40 L730 60 L720 60 L725 75 L715 75 L710 60 L700 60 Z" fill="#1E293B" transform="translate(-30, 10)"/>
  <rect x="55" y="210" width="190" height="60" rx="12" fill="white" stroke="#2563EB" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0;1;1" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>