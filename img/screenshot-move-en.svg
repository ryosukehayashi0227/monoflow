<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#F8FAFC"/>
  <!-- Columns -->
  <rect x="40" y="40" width="220" height="320" rx="20" fill="#E2E8F0" opacity="0.4"/>
  <rect x="290" y="40" width="220" height="320" rx="20" fill="#E2E8F0" opacity="0.4"/>
  <rect x="540" y="40" width="220" height="320" rx="20" fill="#DCFCE7" opacity="0.4"/>
  <!-- Labels -->
  <text x="50" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">TO DO</text>
  <text x="300" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">IN PROGRESS</text>
  <text x="550" y="70" fill="#22C55E" font-family="sans-serif" font-size="10" font-weight="bold">DONE</text>
  <!-- Moving Card -->
  <rect x="305" y="90" width="190" height="60" rx="12" fill="white" shadow="0 4 12 rgba(0,0,0,0.1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 250,150; 250,150" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="105" width="100" height="10" rx="2" fill="#1E293B">
    <animateTransform attributeName="transform" type="translate" values="0,0; 250,150; 250,150" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Static Cards -->
  <rect x="55" y="90" width="190" height="60" rx="12" fill="white" opacity="0.5"/>
  <rect x="555" y="240" width="190" height="60" rx="12" fill="white" opacity="0.8" stroke="#DCFCE7"/>
</svg>