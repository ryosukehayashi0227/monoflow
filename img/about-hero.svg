<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Abstract Productivity Shapes -->
  <circle cx="400" cy="300" r="200" fill="url(#grad1)" opacity="0.1"/>
  <defs>
    <linearGradient id="grad1" x1="200" y1="100" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Flow Lines -->
  <path d="M100 300 C 250 150, 550 450, 700 300" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.2">
    <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Kanban Floating Cards -->
  <g transform="translate(200, 150) rotate(-5)">
    <rect width="180" height="100" rx="20" fill="white" shadow="0 10 20 rgba(0,0,0,0.05)"/>
    <rect x="20" y="20" width="100" height="10" rx="4" fill="#E2E8F0"/>
    <rect x="20" y="40" width="140" height="6" rx="2" fill="#F1F5F9"/>
    <rect x="20" y="55" width="80" height="6" rx="2" fill="#F1F5F9"/>
    <rect x="20" y="75" width="40" height="12" rx="6" fill="#DBEAFE"/>
  </g>

  <g transform="translate(420, 250) rotate(5)">
    <rect width="180" height="120" rx="20" fill="white" shadow="0 10 20 rgba(0,0,0,0.05)"/>
    <rect x="20" y="20" width="120" height="10" rx="4" fill="#1E293B"/>
    <rect x="20" y="45" width="140" height="6" rx="2" fill="#F1F5F9"/>
    <rect x="20" y="60" width="140" height="6" rx="2" fill="#F1F5F9"/>
    <rect x="20" y="75" width="100" height="6" rx="2" fill="#F1F5F9"/>
    <rect x="20" y="95" width="50" height="12" rx="6" fill="#FEE2E2"/>
  </g>

  <!-- Text elements (English) -->
  <text x="400" y="550" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="-0.05em">STAY IN FLOW</text>
  <text x="400" y="575" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.2em">MONOFLOW KANBAN SYSTEM</text>
  
  <!-- Decorative Dots -->
  <circle cx="150" cy="150" r="4" fill="#2563EB" opacity="0.3"/>
  <circle cx="650" cy="450" r="6" fill="#4F46E5" opacity="0.2"/>
  <circle cx="100" cy="500" r="10" fill="#E2E8F0" opacity="0.5"/>
</svg>